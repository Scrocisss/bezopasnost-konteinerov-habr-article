name: container-security-privileged

services:
  default-profile:
    image: container-security-lab/privilege-comparison:1.0-vulnerable
    pull_policy: never
    container_name: lab-privilege-default
    init: true
    user: "0:0"
    ports:
      - "127.0.0.1:8086:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [privileged-lab]

  privileged-profile:
    image: container-security-lab/privilege-comparison:1.0-vulnerable
    pull_policy: never
    container_name: lab-privilege-enabled
    init: true
    user: "0:0"
    privileged: true
    ports:
      - "127.0.0.1:8087:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [privileged-lab]

networks:
  privileged-lab:
    name: container-security-privileged
