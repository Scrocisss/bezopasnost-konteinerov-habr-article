name: container-security-pid-host

services:
  isolated-view:
    image: container-security-lab/pid-host:1.0-vulnerable
    pull_policy: never
    container_name: lab-pid-isolated
    init: true
    user: "10004:10004"
    ports:
      - "127.0.0.1:8084:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [pid-host-lab]

  host-pid-view:
    image: container-security-lab/pid-host:1.0-vulnerable
    pull_policy: never
    container_name: lab-pid-host-view
    init: true
    user: "10004:10004"
    pid: host
    ports:
      - "127.0.0.1:8085:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [pid-host-lab]

  host-marker:
    image: container-security-lab/pid-host:1.0-vulnerable
    pull_policy: never
    container_name: lab-pid-host-marker
    user: "10004:10004"
    command: ["python", "/app/marker.py"]
    environment:
      LAB_PID_MARKER: "practice4-host-marker"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 8
    mem_limit: 32m
    cpus: 0.10
    networks: [pid-host-lab]

networks:
  pid-host-lab:
    name: container-security-pid-host
